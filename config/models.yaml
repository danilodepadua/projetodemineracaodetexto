targets:
  - formal_register
  - thematic_coherence
  - narrative_rhetorical_structure
  - cohesion

models:
  ridge:
    params:
      alpha:
        default: 1.0
        values: [0.01, 0.1, 1.0, 10.0, 100.0]

  linear_svr:
    params:
      C:
        default: 1.0
        values: [0.01, 0.1, 1.0, 10.0, 100.0]
      epsilon: 0.0
      tol: 0.0001
      loss: epsilon_insensitive
      fit_intercept: true
      intercept_scaling: 1.0
      dual: auto
      verbose: 0
      random_state: 42
      max_iter: 10000

targets:
  - formal_register
  - thematic_coherence
  - narrative_rhetorical_structure
  - cohesion

representations:
  - bow
  - tf
  - tfidf
  - structural
  - word2vec_cbow
  - word2vec_skipgram
  - essay_prompt
  - bert

models:
  ridge:
    params:
      alpha:
        default: 1.0
        values: [0.01, 0.1, 1.0, 10.0, 100.0]
      fit_intercept:
        default: true
        values: [true, false]

  linear_svr:
    params:
      C:
        default: 1.0
        values: [0.01, 0.1, 1.0, 10.0, 100.0]
      epsilon:
        default: 0.0
        values: [0.0, 0.1]
      tol: 0.0001
      loss:
        default: epsilon_insensitive
        values: [epsilon_insensitive, squared_epsilon_insensitive]
      fit_intercept: true
      intercept_scaling: 1.0
      dual: auto
      verbose: 0
      random_state: 42
      max_iter: 10000

  random_forest:
    params:
      n_estimators:
        default: 300
        values: [100, 300]
      max_depth:
        default: null
        values: [null, 10, 20]
      min_samples_leaf:
        default: 1
        values: [1, 3]
      max_features: sqrt
      n_jobs: -1
      random_state: 42

  decision_tree:
    params:
      max_depth:
        default: 10
        values: [5, 10, 20, null]
      min_samples_leaf:
        default: 2
        values: [1, 2, 5]
      max_features: sqrt
      random_state: 42

     

    




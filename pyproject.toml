[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = ["artifacts", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.pyright]
include = ["src", "tests"]
exclude = ["artifacts", "data", "notebooks", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
